name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: 'pnpm'
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Length, TypeScript, contracts and API tests
        run: pnpm run check
      - name: Build Volon UI gallery (Storybook)
        run: pnpm run gallery:build
  backend-integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Official Supabase, Prisma migrations, seed and API Docker build
        run: pnpm local:up
      - name: Quotes, Delivery, idempotency, tenant isolation and transaction integration
        run: pnpm test:integration
      - name: Container health
        if: always()
        run: pnpm local:status
      - name: Stop this local stack, preserving volumes
        if: always()
        run: pnpm local:stop
