name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: 'pnpm'
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Length, TypeScript, contracts and API tests
        run: pnpm run check
      - name: Offline Stripe sandbox preflight (no credentials or provider calls)
        run: pnpm stripe:sandbox:preflight
      - name: Manual Stripe trial preflight stays offline in CI
        run: pnpm stripe:sandbox:trial --preflight
      - name: Offline map evaluation (artificial transport, zero external queries)
        run: pnpm maps:evaluate --offline
      - name: Build Volon UI gallery (Storybook)
        run: pnpm run gallery:build
      - name: DeliveryList geometry in a real browser (widths, themes, 200% text)
        run: pnpm run gallery:geometry
        env:
          GEOMETRY_BROWSER_CHANNEL: chrome
      - name: Build merchant web (production bundle without demo fixtures)
        run: pnpm run merchant:build
      - name: merchant-web shell geometry in a real browser (320–1280px, zoom 200%, menus)
        run: pnpm run merchant:geometry
        env:
          GEOMETRY_BROWSER_CHANNEL: chrome
      - name: Export courier mobile demo bundles (Android Hermes + web, no device)
        run: pnpm run courier:export
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
  backend-integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Official Supabase, Prisma migrations, seed and API Docker build
        run: pnpm local:up
      - name: Additive migrations on a separate empty PostgreSQL cluster
        run: node scripts/local/check-clean-migrations.mjs
      - name: Quotes, Delivery, idempotency, tenant isolation and transaction integration
        run: pnpm test:integration
      - name: Container health
        if: always()
        run: pnpm local:status
      - name: Stop this local stack, preserving volumes
        if: always()
        run: pnpm local:stop
