name: Domain checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source length policy
        run: node scripts/check-source-lengths.mjs
      - name: Unit tests (dependency-free)
        run: node --experimental-strip-types --test packages/pricing/tests/*.test.ts
